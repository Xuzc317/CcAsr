<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">CcAsr — 把会议录音，变成有据可查的纪要</title>
  <desc id="desc">暖白与靛紫封面，展示多段录音、说话人转录与带原声引用的会议纪要。</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#E8E8E0" stroke-width="0.7"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#292934" flood-opacity=".07"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="24" fill="#FAFAF7"/>
  <rect x="688" width="592" height="640" fill="url(#grid)" opacity=".55"/>
  <circle cx="1085" cy="218" r="235" fill="#EEF0FE" opacity=".7"/>
  <circle cx="1085" cy="218" r="184" fill="none" stroke="#DDE0FB" stroke-width="1"/>
  <path d="M688 48V592" stroke="#E8E8E0"/>
  <g font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif">
    <g transform="translate(64 56)">
