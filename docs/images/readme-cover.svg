      <path d="M154 24H173M168 19L173 24L168 29" fill="none" stroke="#AAAAAF" stroke-width="1.5"/>
      <rect x="186" width="143" height="48" rx="12" fill="white" stroke="#E3E3DB"/>
      <text x="204" y="30" font-size="16" fill="#4F46E5">Aa</text>
      <text x="233" y="30" font-size="16" fill="#292934">统一转录</text>
      <path d="M340 24H359M354 19L359 24L354 29" fill="none" stroke="#AAAAAF" stroke-width="1.5"/>
      <rect x="372" width="158" height="48" rx="12" fill="#EEF0FE" stroke="#C9CCF5"/>
      <path d="M391 24L396 29L405 19" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="416" y="30" font-size="16" fill="#4038C7">可追溯纪要</text>
    </g>
    <path d="M64 533H610" stroke="#E3E3DB"/>
    <text x="65" y="567" font-size="14" fill="#666670">本地转录<tspan dx="25" fill="#B8B8C0">/</tspan><tspan dx="25" fill="#666670">说话人分离</tspan><tspan dx="25" fill="#B8B8C0">/</tspan><tspan dx="25" fill="#666670">校对与导出</tspan></text>
    <g filter="url(#shadow)">
      <rect x="743" y="92" width="461" height="375" rx="20" fill="white" stroke="#E3E3E9"/>
    </g>
