      <text x="68" y="37" fill="#1B1B24" font-size="36" font-weight="700">Cc<tspan fill="#4F46E5">Asr</tspan></text>
    </g>
    <text x="65" y="167" font-size="13" fill="#777780" letter-spacing="3">YOUR MEETING, CONNECTED.</text>
    <text x="62" y="244" font-size="48" fill="#1B1B24" font-weight="700">把会议录音，</text>
    <text x="62" y="311" font-size="44" fill="#1B1B24" font-weight="700">变成<tspan fill="#4F46E5">有据可查</tspan>的纪要。</text>
    <text x="65" y="368" font-size="19" fill="#666670">多段录音合为一份，重要结论回到原话。</text>
    <g transform="translate(64 420)">
      <rect width="143" height="48" rx="12" fill="white" stroke="#E3E3DB"/>
      <g stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round">
        <path d="M19 21V27M25 16V32M31 19V29"/>
      </g>
