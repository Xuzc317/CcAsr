    <text x="785" y="135" font-size="12" fill="#4F46E5">会议纪要</text>
    <circle cx="1163" cy="130" r="4" fill="#0E9F6E"/>
    <text x="767" y="187" font-size="25" font-weight="700" fill="#1B1B24">产品评审会</text>
    <text x="767" y="215" font-size="13" fill="#92929B">2 段录音 · 3 位说话人 · 一份文档</text>
    <path d="M767 237H1180" stroke="#E8E8E0"/>
    <text x="767" y="274" font-size="16" font-weight="700" fill="#292934">01</text>
    <text x="799" y="274" font-size="16" font-weight="700" fill="#292934">明确结论，保留出处</text>
    <rect x="1081" y="254" width="99" height="28" rx="14" fill="#EEF0FE" stroke="#C9CCF5"/>
    <path d="M1096 262L1105 268L1096 274Z" fill="#4F46E5"/>
    <text x="1112" y="273" font-size="13" fill="#4F46E5" font-family="Consolas, monospace">02:33</text>
    <rect x="767" y="294" width="413" height="62" rx="9" fill="#FAFAF7"/>
    <rect x="767" y="294" width="3" height="62" rx="1.5" fill="#4F46E5"/>
    <text x="784" y="319" font-size="13" fill="#55555F">先完成灰度验证，再推进正式发布。</text>
    <text x="784" y="340" font-size="12" fill="#92929B">点击时间戳，即可回听相关发言。</text>
    <text x="768" y="391" font-size="15" fill="#292934" font-weight="700">02</text>
    <text x="799" y="391" font-size="15" fill="#292934" font-weight="700">行动事项，有人跟进</text>
    <path d="M771 412L775 416L782 407" stroke="#0E9F6E" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="797" y="420" font-size="13" fill="#666670">研发同学 · 完成验证清单</text>
    <g filter="url(#shadow)">
      <rect x="796" y="488" width="383" height="88" rx="16" fill="#292934"/>
