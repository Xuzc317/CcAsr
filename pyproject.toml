[project]
name = "ccasr"
version = "0.1.0"
description = "CcAsr - 离线语音转文字 + 声纹识别服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "funasr>=1.3.1",
    "python-multipart>=0.0.27",
    "uvicorn>=0.46.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "soundfile>=0.13.1",
    "scikit-learn>=1.8.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
]

[tool.uv]
# CPU-only PyTorch (轻量安装，适用于无 GPU 或 macOS MPS)
# 如需 CUDA 加速 (Windows/Linux NVIDIA GPU)，安装后手动替换：
#   uv pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu121
extra-index-url = ["https://download.pytorch.org/whl/cpu"]
