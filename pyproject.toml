[project]
name = "ccasr"
version = "0.1.0"
description = "CcAsr - 会议录音转写 + 说话人分离 + 自动会议纪要"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "funasr>=1.3.1",
    "python-multipart>=0.0.27",
    "uvicorn>=0.46.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "soundfile>=0.13.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.11.0",
    "numpy>=1.26.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# 多语种兜底识别（SenseVoice 覆盖不到的语种）
# 用法： pip install -e ".[whisper]"
#
# ⚠️ av 必须钉 <19：faster-whisper 的依赖只写 `av>=11` 没有上界，
#    而 av>=19 删除了 `metadata_errors` 参数，faster-whisper 仍在调用它，
#    装上最新版会在转写时抛 TypeError。实测 av==18.1.0 可正常工作。
whisper = [
    "faster-whisper>=1.0",
    "av>=11,<19",
]

[tool.uv]
# CPU-only PyTorch (轻量安装，适用于无 GPU 或 macOS MPS)
# 如需 CUDA 加速 (Windows/Linux NVIDIA GPU)，安装后手动替换：
#   uv pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu121
extra-index-url = ["https://download.pytorch.org/whl/cpu"]
